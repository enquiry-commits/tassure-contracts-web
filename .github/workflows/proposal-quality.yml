name: Proposal Quality Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  proposal-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run quality:proposal
